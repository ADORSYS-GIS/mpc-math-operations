[package]
name = "mcp-math-operations"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "HTTP-streamable MCP server exposing arithmetic, statistics, probability, combinatorics, and 2D/3D geographic plotting tools."
repository = "https://github.com/adorsys-gis/mcp-math-operations"
readme = "README.md"
publish = false

[[bin]]
name = "mcp-math-operations"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.7", features = [
    "server",
    "transport-streamable-http-server",
    "macros",
] }
tokio = { version = "1.47", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = "1.2"
axum = "0.8.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
statrs = "0.18"
anyhow = "1.0.102"
num-integer = "0.1.46"
num-traits = "0.2.19"
base64 = "0.22.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
